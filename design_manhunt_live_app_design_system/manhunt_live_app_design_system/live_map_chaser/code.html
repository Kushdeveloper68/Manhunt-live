<!-- MICRO-INTERACTION SCRIPT FOR GLANCEABLE ADRENALINE FEEDBACK -->
<script>
    (function() {
      const tagBtn = document.getElementById('tag-btn');
      const sosBtn = document.getElementById('sos-btn');

      if (tagBtn) {
        tagBtn.addEventListener('click', function() {
          if (navigator.vibrate) navigator.vibrate([40, 60, 100]);
          tagBtn.classList.add('brightness-125');
          setTimeout(() => tagBtn.classList.remove('brightness-125'), 180);
        });
      }

      let holdTimeout = null;
      if (sosBtn) {
        sosBtn.addEventListener('touchstart', function() {
          sosBtn.classList.add('bg-error-container');
          holdTimeout = setTimeout(() => {
            if (navigator.vibrate) navigator.vibrate([200, 100, 300]);
            sosBtn.classList.add('ring-2', 'ring-error');
          }, 3000);
        });

        const cancelHold = () => {
          if (holdTimeout) clearTimeout(holdTimeout);
          sosBtn.classList.remove('bg-error-container', 'ring-2', 'ring-error');
        };

        sosBtn.addEventListener('touchend', cancelHold);
        sosBtn.addEventListener('touchcancel', cancelHold);
      }
    })();
  </script>
