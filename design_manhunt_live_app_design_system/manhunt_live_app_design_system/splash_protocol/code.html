ada", "inverse-surface": "#e5e2e1", "on-error-container": "#ffdad6", "surface": "#131313" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "margin": "1.5rem", "space-xl": "2rem", "space-xs": "0.25rem", "gutter": "1rem", "space-md": "1rem", "space-lg": "1.5rem", "space-sm": "0.5rem" }, fontFamily: { "display-hero-mobile": ["Anton"], "headline-sm": ["Anton"], "label-mono-sm": ["JetBrains Mono"], "headline-md": ["Anton"], "label-mono-md": ["JetBrains Mono"], "body-md": ["Inter"], "body-sm": ["Inter"], "headline-lg": ["Anton"], "display-hero": ["Anton"], "body-lg": ["Inter"], "label-mono-lg": ["JetBrains Mono"] }, fontSize: { "display-hero-mobile": ["36px", { lineHeight: "40px", letterSpacing: "0.02em", fontWeight: "400" }], "headline-sm": ["20px", { lineHeight: "24px", letterSpacing: "0.04em", fontWeight: "400" }], "label-mono-sm": ["11px", { lineHeight: "14px", letterSpacing: "0.04em", fontWeight: "500" }], "headline-md": ["24px", { lineHeight: "28px", letterSpacing: "0.03em", fontWeight: "400" }], "label-mono-md": ["14px", { lineHeight: "18px", letterSpacing: "0.01em", fontWeight: "500" }], "body-md": ["14px", { lineHeight: "20px", fontWeight: "400" }], "body-sm": ["12px", { lineHeight: "16px", fontWeight: "400" }], "headline-lg": ["32px", { lineHeight: "36px", letterSpacing: "0.03em", fontWeight: "400" }], "display-hero": ["44px", { lineHeight: "48px", letterSpacing: "0.02em", fontWeight: "400" }], "body-lg": ["16px", { lineHeight: "24px", fontWeight: "500" }], "label-mono-lg": ["18px", { lineHeight: "22px", letterSpacing: "-0.02em", fontWeight: "700" }] } } } };</script></head><body class="bg-surface font-body-md text-body-md text-on-surface antialiased flex flex-col min-h-screen"><main class="flex flex-col relative w-full pt-safe pb-safe bg-surface min-h-screen"><div class="flex flex-col w-full items-center justify-between px-6 py-12 select-none" style="min-height: calc(100vh - 4rem);">
<div class="w-full flex items-center justify-between opacity-80 pt-2">
<div class="flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-surface-tint animate-pulse"></span>
<span class="font-label-mono-sm text-label-mono-sm tracking-widest text-on-surface-variant uppercase">NET.SYS // ACTIVE</span>
</div>
<span class="font-label-mono-sm text-label-mono-sm tracking-widest text-on-surface-variant uppercase">v2.4.0</span>
</div>
<div class="flex flex-col items-center justify-center text-center my-auto py-10">
<div class="relative mb-6 flex items-center justify-center">
<div class="w-16 h-16 flex items-center justify-center">
<img alt="MANHUNT Crosshair Icon" class="w-14 h-14 object-contain filter drop-shadow-[0_0_8px_rgba(190,245,0,0.3)] transition-transform duration-700 ease-out hover:scale-105" src="https://lh3.googleusercontent.com/aida/AEtjO1V0tpwCLNEa92G8gt-Ni-bBGO3u1WlMRJBCUe-2iXpwFKVAYSuy354t4LGrEeldut4tJqTe6EOLujJvCLgXvsGIy1SzBtntDghix-9dGjD6WUqfTXMXLCces9o6Ilh5UHQEktL6ivsFibl1FbJ9SAri2nygTWaHmzt3JT8r-6E22PlQx7VqIRHAFyvsLn4nY2yNAnPSWoNbjCe-VYWTpzZmnZfCjvp9gGBYqM8Cf_QL"/>
</div>
<div class="absolute -inset-2 pointer-events-none opacity-20">
<svg class="w-20 h-20 text-surface-tint animate-spin" fill="none" style="animation-duration: 20s;" viewbox="0 0 100 100">
<circle cx="50" cy="50" r="46" stroke="currentColor" stroke-dasharray="6 14" stroke-width="1"></circle>
</svg>
</div>
</div>
<h1 class="font-display-hero text-display-hero tracking-tight text-primary uppercase select-none m-0 leading-none">
      MANHUNT LIVE
    </h1>
<p class="font-body-md text-body-md tracking-[0.25em] font-medium text-on-surface-variant uppercase mt-3 mb-0">
      THE CITY IS THE ARENA.
    </p>
<div class="flex items-center gap-3 mt-6">
<span class="px-2.5 py-1 rounded bg-surface-container font-label-mono-sm text-label-mono-sm text-surface-tint uppercase tracking-wider">
        GPS LOCKING
      </span>
<span class="px-2.5 py-1 rounded bg-surface-container font-label-mono-sm text-label-mono-sm text-on-surface-variant uppercase tracking-wider" id="sat-count">
        SAT: 14/16
      </span>
</div>
</div>
<div class="w-full flex flex-col items-center justify-end pb-4">
<div class="w-36 h-0.5 bg-surface-container rounded-full overflow-hidden relative">
<div class="h-full bg-surface-tint w-0 transition-all duration-300 ease-out rounded-full shadow-[0_0_10px_#bef500]" id="boot-loader"></div>
</div>
<div class="flex items-center justify-between w-36 mt-2.5 text-on-surface-variant">
<span class="font-label-mono-sm text-label-mono-sm text-[10px] tracking-wider uppercase opacity-60">ACQUIRING</span>
<span class="font-label-mono-sm text-label-mono-sm text-[10px] text-surface-tint font-bold" id="load-pct">0%</span>
</div>
</div>
</div>
<script>
  (function initTelemetryLoading() {
    const bar = document.getElementById('boot-loader');
    const pct = document.getElementById('load-pct');
    const sat = document.getElementById('sat-count');
    let progress = 14;

    const interval = setInterval(() => {
      progress += Math.floor(Math.random() * 18) + 8;
      if (progress >= 100) {
        progress = 100;
        clearInterval(interval);
        if (bar) bar.style.width = '100%';
        if (pct) {
          pct.textContent = 'READY';
          pct.classList.add('text-primary-fixed');
        }
        if (sat) sat.textContent = 'SAT: LOCKED';
      } else {
        if (bar) bar.style.width = progress + '%';
        if (pct) pct.textContent = progress + '%';
      }
    }, 180);
  })();
</script></main></body></html>
