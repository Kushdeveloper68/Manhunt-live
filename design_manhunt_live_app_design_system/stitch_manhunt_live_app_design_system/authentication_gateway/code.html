</div>
<!-- Title & Subtitle -->

      MANHUNT LIVE
    </h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-space-xs max-w-[280px]">

    </p>
<!-- Radar Sweep Micro-Display for High-Tech Street Delight -->
<div class="w-full max-w-[320px] mt-space-xl p-space-md rounded-xl bg-surface-container-low flex flex-col items-center">
<div class="w-full flex items-center justify-between pb-space-xs mb-space-xs">
<span class="font-label-mono-sm text-label-mono-sm text-on-surface-variant uppercase tracking-wider">ACTIVE LOBBIES NEAR YOU</span>
<span class="font-label-mono-sm text-label-mono-sm text-primary-fixed font-bold">14 OPS</span>
</div>
<div class="w-full flex items-center gap-space-sm pt-space-xs">
<div class="flex items-center gap-1.5">
<span class="w-1.5 h-1.5 rounded-full bg-secondary-container"></span>
<span class="font-label-mono-sm text-label-mono-sm text-on-surface">CHASERS: 42</span>
</div>
<span class="text-surface-container-highest">•</span>

<span class="w-1.5 h-1.5 rounded-full bg-tertiary-fixed-dim"></span>

</div>
</div>
</div>
</div>
<!-- Primary Interactive Pathway Zone -->
<div class="flex flex-col w-full mt-space-xl mb-space-md">
<div class="flex flex-col w-full space-y-3">
<!-- 1. Continue with Phone (Primary Highlighted Tactical CTA) -->
<button class="w-full h-[52px] rounded-xl bg-primary-fixed text-on-primary-fixed font-body-lg text-body-lg font-bold tracking-wide flex items-center justify-center gap-3 transition-transform active:scale-[0.98] shadow-sm cursor-pointer" id="btn-auth-phone" type="button">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">phone_android</span>
<span>CONTINUE WITH PHONE</span>
</button>
<!-- 2. Continue with Google -->
<button class="w-full h-[52px] rounded-xl bg-surface-container text-on-surface font-body-lg text-body-lg font-medium flex items-center justify-center gap-3 transition-transform active:scale-[0.98] active:bg-surface-container-high cursor-pointer" id="btn-auth-google" type="button">
<!-- Clean Google G SVG Icon -->
<svg class="w-5 h-5" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"></path>
</svg>
<span>Continue with Google</span>
</button>
<!-- 3. Continue with Email -->
<button class="w-full h-[52px] rounded-xl bg-surface-container text-on-surface font-body-lg text-body-lg font-medium flex items-center justify-center gap-3 transition-transform active:scale-[0.98] active:bg-surface-container-high cursor-pointer" id="btn-auth-email" type="button">
<span class="material-symbols-outlined text-[20px] text-on-surface-variant">mail</span>
<span>Continue with Email</span>
</button>
</div>
<!-- Quick Emergency Operator / Guest Bypass Link -->
<div class="mt-space-md text-center">
<button class="inline-flex items-center gap-1.5 py-1 px-3 rounded-full bg-surface-container-low text-on-surface-variant hover:text-on-surface active:bg-surface-container-high transition-colors" id="btn-spectator-mode" type="button">
<span class="material-symbols-outlined text-[14px]">visibility</span>
<span class="font-label-mono-sm text-label-mono-sm uppercase tracking-wider">SPECTATOR QUICK DISPATCH</span>
</button>
</div>
</div>

<div class="w-full pt-space-md pb-space-xs text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant leading-relaxed">

    </p>
<div class="flex items-center justify-center gap-2 mt-2">
<span class="w-1.5 h-1.5 rounded-full bg-primary-fixed"></span>
<span class="font-label-mono-sm text-label-mono-sm text-on-surface-variant uppercase tracking-widest text-[9px]">ENCRYPTED GPS DISPATCH v4.12</span>
</div>
</div>
</div>
<script>
  // Tactical micro-feedback on auth trigger buttons
  const buttons = ['btn-auth-phone', 'btn-auth-google', 'btn-auth-email', 'btn-spectator-mode'];
  buttons.forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('click', () => {
      if (window.navigator && window.navigator.vibrate) {
        window.navigator.vibrate(12);
      }
    });
  });
</script></main></body></html>
